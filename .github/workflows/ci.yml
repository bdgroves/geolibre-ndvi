name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          cache: false   # pixi.lock is gitignored; the cache needs one

      - name: Run tests
        run: pixi run test

      - name: Check notebooks are valid JSON
        run: pixi run python -c "
          import json, glob, sys;
          [json.load(open(f)) for f in glob.glob('notebooks/*.ipynb')];
          print('notebooks ok')"
